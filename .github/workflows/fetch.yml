name: 获取特斯拉数据并生成报告

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# 允许 Actions 把 index.html 推回仓库（否则 git push 会 403）
permissions:
  contents: write

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests pytz

      - name: 抓取特斯拉数据并生成网页
        env:
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
        run: python .github/workflows/generate_report.py

      - name: 提交网页到本仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新报告"
          git push
