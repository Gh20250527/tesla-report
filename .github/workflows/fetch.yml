name: 获取特斯拉数据并生成报告
on:
  schedule:
    # 每30分钟运行一次，你可以修改
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests pytz

      - name: 抓取特斯拉数据并生成网页
        env:
          TESLA_USERNAME: ${{ secrets.TESLA_USERNAME }}
          TESLA_PASSWORD: ${{ secrets.TESLA_PASSWORD }}
        run: python .github/workflows/generate_report.py

      - name: 提交网页到本仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新报告" && git push)
